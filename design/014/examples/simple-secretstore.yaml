apiVersion: external-secrets.io/v1alpha1
kind: ClusterProviderClass
metadata:
  name: aws
spec:
  endpoint:
    address: provider-aws.external-secrets-system.svc:8443
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-prod
  namespace: team-a
spec:
  runtimeRef:
    kind: ClusterProviderClass ## ProviderClass are also possible - on the same ns as the Store
    name: aws
  providerRef: #Always on same Namespace as SecretStore
    apiVersion: provider.external-secrets.io/v1alpha1
    kind: SecretsManager
    name: aws-prod
---
apiVersion: provider.external-secrets.io/v1alpha1
kind: SecretsManager
metadata:
  name: aws-prod
  namespace: team-a
spec:
  region: eu-central-1
  role: arn:aws:iam::123456789012:role/team-a-prod
  auth:
    jwt:
      serviceAccountRef:
        name: app-secrets
