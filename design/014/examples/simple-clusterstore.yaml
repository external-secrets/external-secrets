apiVersion: external-secrets.io/v1alpha1
kind: ClusterProviderClass
metadata:
  name: aws
spec:
  endpoint:
    address: provider-aws.external-secrets-system.svc:8443
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-prod
spec:
  runtimeRef:
    kind: ClusterProviderClass
    # namespace: optional # Only if using a namespaced Provider Class
    name: aws
  providerRef:
    apiVersion: provider.external-secrets.io/v1alpha1
    kind: SecretsManager
    name: aws-prod
    namespace: defined # Mandatory for a ClsuterSecretStore
---
apiVersion: provider.external-secrets.io/v1alpha1
kind: SecretsManager
metadata:
  name: aws-prod
  namespace: defined
spec:
  region: eu-central-1
  role: arn:aws:iam::123456789012:role/team-a-prod
  auth:
    jwt:
      serviceAccountRef:
        name: app-secrets
        namespace: defined
