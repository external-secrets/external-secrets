name: Update GitHub Actions

# Each Action is listed explicitly so Updatecli resolves every upstream
# repository once instead of creating a pipeline for every usage.
# Every managed Action is pinned by commit digest. Updatecli resolves the latest
# semantic-version tag and updates both the digest and its version comment.

sources:
  actions_attest_build_provenance_version:
    name: Get latest actions/attest-build-provenance tag
    kind: gittag
    spec:
      url: https://github.com/actions/attest-build-provenance.git
      versionfilter:
        kind: semver
        pattern: '*'
  actions_attest_build_provenance_digest:
    name: Get digest for latest actions/attest-build-provenance tag
    kind: gittag
    spec:
      url: https://github.com/actions/attest-build-provenance.git
      key: hash
      versionfilter:
        kind: regex
        pattern: '{{ source "actions_attest_build_provenance_version" }}'
