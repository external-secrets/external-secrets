    sourceid: controller-gen_linux_arm64_sha256
  controller-gen_version:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    name: Update controller-gen version
    kind: file
    spec:
      file: Makefile
      matchpattern: (?m)^CONTROLLER_GEN_VERSION := v?[0-9]+\.[0-9]+\.[0-9]+$
      replacepattern: CONTROLLER_GEN_VERSION := {{ source "controller-gen_version" }}
    sourceid: controller-gen_version
  cosign_version:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    spec:
      files:
        - .github/actions/sign/action.yml
        - .github/workflows/helm.yml
