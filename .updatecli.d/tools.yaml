name: Update development tools

pipelineid: dependencies/tools

# Publishing is opt-in so local runs continue to update the current checkout.
#{{- if .scm.enabled }}
actions:
  dependency-pr:
    kind: github/pullrequest
    scmid: default
    title: "chore(deps): update development tools"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: main
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      user: External Secrets Operator
      email: ExternalSecretsOperator@users.noreply.github.com
      commitusingapi: true
      workingbranchprefix: dependencies
      workingbranchseparator: "/"
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true
        footers: 'Signed-off-by: External Secrets Operator <ExternalSecretsOperator@users.noreply.github.com>'
#{{- end }}
# Upstream metadata and update policy are explicit in this file. Current
# versions and platform checksums are maintained directly in the Makefile.
sources:
  controller-gen_darwin_amd64_sha256:
    name: Get controller-gen checksum for darwin-amd64
    kind: http
    transformers:
      - findsubmatch:
          pattern: (?s)"name"\s*:\s*"controller-gen-darwin-amd64".*?"digest"\s*:\s*"sha256:([a-f0-9]{64})"
          captureindex: 1
    spec:
      request:
        headers:
          Authorization: Bearer {{ requiredEnv "GITHUB_TOKEN" }}
      url: https://api.github.com/repos/kubernetes-sigs/controller-tools/releases/tags/{{ source "controller-gen_version" }}
  controller-gen_darwin_arm64_sha256:
    name: Get controller-gen checksum for darwin-arm64
