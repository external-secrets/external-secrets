  controller-gen_linux_arm64_sha256:
    name: Get controller-gen checksum for linux-arm64
    kind: http
    transformers:
      - findsubmatch:
          pattern: (?s)"name"\s*:\s*"controller-gen-linux-arm64".*?"digest"\s*:\s*"sha256:([a-f0-9]{64})"
          captureindex: 1
    spec:
      request:
        headers:
