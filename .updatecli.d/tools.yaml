targets:
  controller-gen_darwin_amd64_sha256:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    name: Update controller-gen checksum for darwin-amd64
    kind: file
    spec:
      file: Makefile
      matchpattern: (?m)^CONTROLLER_GEN_DARWIN_AMD64_SHA256 := [a-f0-9]{64}$
      replacepattern: CONTROLLER_GEN_DARWIN_AMD64_SHA256 := {{ source "controller-gen_darwin_amd64_sha256" }}
    sourceid: controller-gen_darwin_amd64_sha256
  controller-gen_darwin_arm64_sha256:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    name: Update controller-gen checksum for darwin-arm64
