name: Update Helm dependencies

pipelineid: dependencies/helm

# Publishing is opt-in so local runs continue to update the current checkout.
#{{- if .scm.enabled }}
actions:
  dependency-pr:
    kind: github/pullrequest
    scmid: default
    title: "chore(deps): update Helm dependencies"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: main
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      user: External Secrets Operator
      email: ExternalSecretsOperator@users.noreply.github.com
      commitusingapi: true
      workingbranchprefix: dependencies
      workingbranchseparator: "/"
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true
        footers: 'Signed-off-by: External Secrets Operator <ExternalSecretsOperator@users.noreply.github.com>'
#{{- end }}

# Keep chart dependencies explicit so each repository and update policy is
# visible here instead of being generated by autodiscovery.
sources:
  argocd:
    kind: helmchart
    spec:
      name: argo-cd
      url: https://argoproj.github.io/argo-helm
      versionfilter: &all_versions
        kind: semver
        pattern: '*'
  vault:
    kind: helmchart
    spec:
      name: vault
      url: https://helm.releases.hashicorp.com
      versionfilter: *all_versions
  openbao:
    kind: helmchart
    spec:
      name: openbao
      url: https://openbao.github.io/openbao-helm
      versionfilter: *all_versions
  conjur:
    kind: helmchart
    spec:
      name: conjur-oss
      url: https://cyberark.github.io/helm-charts
      versionfilter: *all_versions
  infisical:
    kind: helmchart
    spec:
      name: infisical-standalone
      url: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
      versionfilter: *all_versions
  bitwarden_sdk_server:
    kind: helmchart
    spec:
      name: bitwarden-sdk-server
      url: oci://ghcr.io/external-secrets/charts
      versionfilter:
        kind: semver
        pattern: '>=0'

conditions:
  bitwarden_sdk_server:
    name: Ensure the bitwarden-sdk-server dependency exists
    kind: yaml
    disablesourceinput: true
    spec:
      file: deploy/charts/external-secrets/Chart.yaml
      key: $.dependencies[0].name
      value: bitwarden-sdk-server

targets:
  bitwarden_sdk_server:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    name: Bump the bitwarden-sdk-server chart dependency
    kind: helmchart
    sourceid: bitwarden_sdk_server
    spec:
      file: Chart.yaml
      key: $.dependencies[0].version
      name: deploy/charts/external-secrets
      skippackaging: false
  argocd:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: argocd
    spec:
      file: e2e/suites/argocd/install.go
      matchpattern: 'ChartVersion: "[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'ChartVersion: "{{ source "argocd" }}"'
  vault:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: vault
    spec:
      file: e2e/framework/addon/vault.go
      matchpattern: 'ChartVersion: "[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'ChartVersion: "{{ source "vault" }}"'
  openbao:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: openbao
    spec:
      file: e2e/framework/addon/openbao.go
      matchpattern: 'ChartVersion: "[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'ChartVersion: "{{ source "openbao" }}"'
  conjur:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: conjur
    spec:
      file: e2e/framework/addon/conjur.go
      matchpattern: 'ChartVersion: "[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'ChartVersion: "{{ source "conjur" }}"'
  infisical:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: infisical
    spec:
      file: e2e/framework/addon/infisical.go
      matchpattern: 'infisicalChartVer\s+=\s+"[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'infisicalChartVer    = "{{ source "infisical" }}"'
