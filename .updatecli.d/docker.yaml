name: Update container images

pipelineid: dependencies/docker

# Publishing is opt-in so local runs continue to update the current checkout.
#{{- if .scm.enabled }}
actions:
  dependency-pr:
    kind: github/pullrequest
    scmid: default
    title: "chore(deps): update container images"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: main
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      user: External Secrets Operator
      email: ExternalSecretsOperator@users.noreply.github.com
      commitusingapi: true
      workingbranchprefix: dependencies
      workingbranchseparator: "/"
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true
        footers: 'Signed-off-by: External Secrets Operator <ExternalSecretsOperator@users.noreply.github.com>'
#{{- end }}

# Keep images explicit so each registry source is resolved once, regardless of
# how many Dockerfiles use it.
sources:
  alpine_tag:
    kind: dockerimage
    spec:
      image: alpine
      tag: 3.24.1
      versionfilter:
        kind: semver
        # Avoid unrelated date-like tags such as Alpine's 20260805 tag.
        pattern: '3.x'
  alpine:
    kind: dockerdigest
    spec:
      image: alpine
      tag: '{{ source "alpine_tag" }}'
  golang_tag:
    kind: dockerimage
    spec:
      image: golang
      tag: 1.27.0
      versionfilter:
        kind: semver
        pattern: '1.x.x-0'
  golang_alpine:
    kind: dockerdigest
    spec:
      image: golang
      tag: '{{ source "golang_tag" }}-alpine'
  golang_bookworm:
    kind: dockerdigest
    spec:
      image: golang
      tag: '{{ source "golang_tag" }}-bookworm'
  distroless_static:
    kind: dockerdigest
    spec:
      image: gcr.io/distroless/static
      tag: latest
  ubi9:
    kind: dockerdigest
    spec:
      image: registry.access.redhat.com/ubi9/ubi
      tag: latest

  skywalking_tag:
    kind: dockerimage
    spec:
      image: apache/skywalking-eyes
      tag: 0.6.0
      versionfilter:
        kind: semver
        pattern: '*'
  skywalking:
    kind: dockerdigest
    spec:
      image: apache/skywalking-eyes
      tag: '{{ source "skywalking_tag" }}'
  helm_docs_tag:
    kind: dockerimage
    spec:
      image: jnorwood/helm-docs
      tag: v1.14.2
      versionfilter:
        kind: semver
        pattern: '*'
  helm_docs:
    kind: dockerdigest
    spec:
      image: jnorwood/helm-docs
      tag: '{{ source "helm_docs_tag" }}'
  kind_node_tag:
    kind: dockerimage
    spec:
      image: kindest/node
      tag: v1.33.4
      versionfilter:
        kind: semver
        pattern: '*'
  kind_node:
    kind: dockerdigest
    spec:
      image: kindest/node
      tag: '{{ source "kind_node_tag" }}'
  curl_tag:
    kind: dockerimage
    spec:
      image: curlimages/curl
      tag: 8.11.0
      versionfilter:
        kind: semver
        pattern: '*'
  curl:
    kind: dockerdigest
    spec:
      image: curlimages/curl
      tag: '{{ source "curl_tag" }}'
  distroless_debian12:
    kind: dockerdigest
    spec:
      image: gcr.io/distroless/static-debian12
      tag: latest
  pull_request_label_checker:
    kind: dockerdigest
    spec:
      image: agilepathway/pull-request-label-checker
      tag: latest

targets:
  alpine:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: alpine
    transformers:
      - addprefix: 'alpine:'
    spec:
      files:
        - e2e/Dockerfile
        - hack/api-docs/Dockerfile
      matchpattern: 'alpine:v?[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:@sha256:[a-f0-9]{64})?'
  golang_alpine:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: golang_alpine
    transformers:
      - addprefix: 'golang:'
    spec:
      file: Dockerfile.standalone
      matchpattern: 'golang:v?[0-9]+\.[0-9]+\.[0-9]+-alpine(?:@sha256:[a-f0-9]{64})?'
  golang_bookworm:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: golang_bookworm
    transformers:
      - addprefix: 'golang:'
    spec:
      file: e2e/Dockerfile
      matchpattern: 'golang:v?[0-9]+\.[0-9]+\.[0-9]+-bookworm(?:@sha256:[a-f0-9]{64})?'
  distroless_static:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: distroless_static
    transformers:
      - addprefix: 'gcr.io/distroless/static:'
    spec:
      files:
        - Dockerfile
        - Dockerfile.standalone
      matchpattern: 'gcr.io/distroless/static:[^[:space:]]+'
  ubi9:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: ubi9
    transformers:
      - addprefix: 'registry.access.redhat.com/ubi9/ubi:'
    spec:
      file: Dockerfile.ubi
      matchpattern: 'registry.access.redhat.com/ubi9/ubi:[^[:space:]]+'
  skywalking:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: skywalking
    transformers:
      - addprefix: 'apache/skywalking-eyes:'
    spec:
      file: Makefile
      matchpattern: 'apache/skywalking-eyes:[^[:space:]]+'
  helm_docs:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: helm_docs
    transformers:
      - addprefix: 'docker.io/jnorwood/helm-docs:'
    spec:
      file: Makefile
      matchpattern: 'docker.io/jnorwood/helm-docs:[^[:space:]]+'
  kind_node:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: kind_node
    transformers:
      - addprefix: 'kindest/node:'
    spec:
      files:
        - .github/workflows/e2e.yml
        - .github/workflows/e2e-reusable.yml
      matchpattern: 'kindest/node:v?[0-9]+\.[0-9]+\.[0-9]+(?:@sha256:[a-f0-9]{64})?'
  curl:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: curl
    transformers:
      - addprefix: 'curlimages/curl:'
    spec:
      file: e2e/framework/addon/conjur.go
      matchpattern: 'curlimages/curl:[^"[:space:]]+'
  distroless_debian12:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: distroless_debian12
    transformers:
      - addprefix: 'gcr.io/distroless/static-debian12:'
    spec:
      file: e2e/framework/addon/conjur.go
      matchpattern: 'gcr.io/distroless/static-debian12:[^"[:space:]]+'
  pull_request_label_checker:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: pull_request_label_checker
    transformers:
      - addprefix: 'docker://agilepathway/pull-request-label-checker:'
    spec:
      file: .github/workflows/pull-request-label.yml
      matchpattern: 'docker://agilepathway/pull-request-label-checker:[^[:space:]]+'
