# Code generated by hack/updatecli-gomodules; DO NOT EDIT.
name: Update Go version

pipelineid: dependencies/golang

# Publishing is opt-in so local runs continue to update the current checkout.
#{{- if .scm.enabled }}
actions:
  dependency-pr:
    kind: github/pullrequest
    scmid: default
    title: "chore(deps): update Go version"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: main
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      user: External Secrets Operator
      email: ExternalSecretsOperator@users.noreply.github.com
      commitusingapi: true
      workingbranchprefix: dependencies
      workingbranchseparator: "/"
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true
        footers: 'Signed-off-by: External Secrets Operator <ExternalSecretsOperator@users.noreply.github.com>'
#{{- end }}

sources:
  go-version:
    name: Get latest Go patch release
    kind: golang
    spec:
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '1.x'

# Updatecli searchpattern uses filepath.Match: * does not cross directories.
# Keep the depths in both targets in sync when adding a deeper Go module.
targets:
  go-required:
    name: Bump Go language version in all go.mod files
    kind: file
    sourceid: go-version
    transformers:
      - findsubmatch:
          pattern: '^([0-9]+\.[0-9]+)\.[0-9]+$'
          capturepattern: '\1.0'
      - addprefix: 'go '
#{{- if .scm.enabled }}
    scmid: default
#{{- end }}
    spec:
      files:
        - 'go.mod'
        - '*/go.mod'
        - '*/*/*/go.mod'
      searchpattern: true
      matchpattern: '(?m)^go [0-9]+\.[0-9]+(?:\.[0-9]+)?$'
  go-toolchain:
    name: Bump Go toolchain in all go.mod files
    kind: file
    sourceid: go-version
    transformers:
      - addprefix: 'toolchain go'
#{{- if .scm.enabled }}
    scmid: default
#{{- end }}
    spec:
      files:
        - 'go.mod'
        - '*/go.mod'
        - '*/*/*/go.mod'
      searchpattern: true
      matchpattern: '(?m)^toolchain go[0-9]+\.[0-9]+\.[0-9]+$'
