# Code generated by hack/updatecli-gomodules; DO NOT EDIT.
name: Update Go version

pipelineid: dependencies/golang

# Publishing is opt-in so local runs continue to update the current checkout.
#{{- if .scm.enabled }}
actions:
  dependency-pr:
    kind: github/pullrequest
    scmid: default
    title: "chore(deps): update Go version"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: main
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      user: External Secrets Operator
      email: ExternalSecretsOperator@users.noreply.github.com
      commitusingapi: true
      workingbranchprefix: dependencies
      workingbranchseparator: "/"
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true
        footers: 'Signed-off-by: External Secrets Operator <ExternalSecretsOperator@users.noreply.github.com>'
#{{- end }}

sources:
  go-version:
    name: Get latest Go patch release
    kind: golang
    spec:
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '1.x'
  # Go images are pinned by digest only; resolve them from the Go release above
  # so the toolchain, the image digests and their release comments move together.
  golang_bookworm_digest:
    kind: dockerdigest
    spec:
      image: golang
      tag: '{{ source "go-version" }}-bookworm'
      hidetag: true
  golang_alpine_digest:
    kind: dockerdigest
    spec:
      image: golang
      tag: '{{ source "go-version" }}-alpine'
      hidetag: true
  golang_debug_digest:
    kind: dockerdigest
    spec:
      image: golang
      tag: '{{ source "go-version" }}'
      hidetag: true

# Updatecli searchpattern uses filepath.Match: * does not cross directories.
# Keep the depths in both targets in sync when adding a deeper Go module.
targets:
  go-required:
    name: Bump Go language version in all go.mod files
    kind: file
    sourceid: go-version
    transformers:
      - findsubmatch:
          pattern: '^([0-9]+\.[0-9]+)\.[0-9]+$'
          capturepattern: '\1.0'
      - addprefix: 'go '
#{{- if .scm.enabled }}
    scmid: default
#{{- end }}
    spec:
      files:
        - 'go.mod'
        - '*/go.mod'
        - '*/*/*/go.mod'
      searchpattern: true
      matchpattern: '(?m)^go [0-9]+\.[0-9]+(?:\.[0-9]+)?$'
  go-toolchain:
    name: Bump Go toolchain in all go.mod files
    kind: file
    sourceid: go-version
    transformers:
      - addprefix: 'toolchain go'
#{{- if .scm.enabled }}
    scmid: default
#{{- end }}
    spec:
      files:
        - 'go.mod'
        - '*/go.mod'
        - '*/*/*/go.mod'
      searchpattern: true
      matchpattern: '(?m)^toolchain go[0-9]+\.[0-9]+\.[0-9]+$'
  golang_alpine:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: golang_alpine_digest
    transformers:
      - addprefix: 'golang'
    spec:
      file: Dockerfile.standalone
      matchpattern: 'golang@sha256:[a-f0-9]{64}'
  golang_bookworm:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: golang_bookworm_digest
    transformers:
      - addprefix: 'golang'
    spec:
      file: e2e/Dockerfile
      matchpattern: 'golang@sha256:[a-f0-9]{64}'
  golang:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: golang_debug_digest
    transformers:
      - addprefix: 'golang'
    spec:
      file: tilt.debug.dockerfile
      matchpattern: 'golang@sha256:[a-f0-9]{64}'

  # These targets refresh the readable release next to each SHA-only reference.
  golang_bookworm_release:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: go-version
    transformers:
      - addprefix: '# Pinned release: golang:'
      - addsuffix: '-bookworm (Go; tracking 1.x on Debian Bookworm)'
    spec:
      file: e2e/Dockerfile
      matchpattern: '# Pinned release: golang:[^\r\n]+'
  golang_alpine_release:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: go-version
    transformers:
      - addprefix: '# Pinned release: golang:'
      - addsuffix: '-alpine (Go; tracking 1.x on Alpine)'
    spec:
      file: Dockerfile.standalone
      matchpattern: '# Pinned release: golang:[^\r\n]+'
  golang_debug_release:
    #{{- if .scm.enabled }}
    scmid: default
    #{{- end }}
    kind: file
    sourceid: go-version
    transformers:
      - addprefix: '# Pinned release: golang:'
      - addsuffix: ' (Go; tracking 1.x)'
    spec:
      file: tilt.debug.dockerfile
      matchpattern: '# Pinned release: golang:[^\r\n]+'
