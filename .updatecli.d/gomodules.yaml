#{{- if .scm.enabled }}
    scmid: default
#{{- end }}
    spec:
      shell: /bin/bash
      command: |
        # Native targets render the complete go.mod diff during a preview.
        if [[ "$DRY_RUN" == true ]]; then
          exit 0
        fi

        set -euo pipefail
        modules="$(mktemp)"
        trap 'rm -f "$modules"' EXIT
        {
          printf '%s\n' 'apis/go.mod'
          printf '%s\n' 'e2e/go.mod'
          printf '%s\n' 'generators/v1/acr/go.mod'
          printf '%s\n' 'generators/v1/beyondtrustworkloadcredentials/go.mod'
          printf '%s\n' 'generators/v1/cloudsmith/go.mod'
          printf '%s\n' 'generators/v1/ecr/go.mod'
          printf '%s\n' 'generators/v1/fake/go.mod'
          printf '%s\n' 'generators/v1/gcr/go.mod'
          printf '%s\n' 'generators/v1/github/go.mod'
          printf '%s\n' 'generators/v1/gitlab/go.mod'
          printf '%s\n' 'generators/v1/grafana/go.mod'
          printf '%s\n' 'generators/v1/mfa/go.mod'
          printf '%s\n' 'generators/v1/password/go.mod'
          printf '%s\n' 'generators/v1/quay/go.mod'
          printf '%s\n' 'generators/v1/sshkey/go.mod'
          printf '%s\n' 'generators/v1/sts/go.mod'
          printf '%s\n' 'generators/v1/uuid/go.mod'
          printf '%s\n' 'generators/v1/vault/go.mod'
          printf '%s\n' 'generators/v1/webhook/go.mod'
          printf '%s\n' 'go.mod'
          printf '%s\n' 'hack/tools/gen-crd-api-reference-docs/go.mod'
          printf '%s\n' 'providers/v1/akeyless/go.mod'
          printf '%s\n' 'providers/v1/aws/go.mod'
          printf '%s\n' 'providers/v1/azure/go.mod'
          printf '%s\n' 'providers/v1/barbican/go.mod'
          printf '%s\n' 'providers/v1/beyondtrust/go.mod'
          printf '%s\n' 'providers/v1/beyondtrustworkloadcredentials/go.mod'
          printf '%s\n' 'providers/v1/bitwarden/go.mod'
          printf '%s\n' 'providers/v1/chef/go.mod'
          printf '%s\n' 'providers/v1/cloudru/go.mod'
          printf '%s\n' 'providers/v1/conjur/go.mod'
          printf '%s\n' 'providers/v1/crd/go.mod'
          printf '%s\n' 'providers/v1/delinea/go.mod'
          printf '%s\n' 'providers/v1/doppler/go.mod'
          printf '%s\n' 'providers/v1/dvls/go.mod'
          printf '%s\n' 'providers/v1/fake/go.mod'
          printf '%s\n' 'providers/v1/fortanix/go.mod'
          printf '%s\n' 'providers/v1/gcp/go.mod'
          printf '%s\n' 'providers/v1/github/go.mod'
          printf '%s\n' 'providers/v1/gitlab/go.mod'
          printf '%s\n' 'providers/v1/ibm/go.mod'
          printf '%s\n' 'providers/v1/infisical/go.mod'
          printf '%s\n' 'providers/v1/keepersecurity/go.mod'
          printf '%s\n' 'providers/v1/kubernetes/go.mod'
          printf '%s\n' 'providers/v1/nebius/go.mod'
          printf '%s\n' 'providers/v1/ngrok/go.mod'
          printf '%s\n' 'providers/v1/onboardbase/go.mod'
          printf '%s\n' 'providers/v1/onepassword/go.mod'
          printf '%s\n' 'providers/v1/onepasswordsdk/go.mod'
          printf '%s\n' 'providers/v1/openbao/go.mod'
          printf '%s\n' 'providers/v1/oracle/go.mod'
          printf '%s\n' 'providers/v1/ovh/go.mod'
          printf '%s\n' 'providers/v1/passbolt/go.mod'
          printf '%s\n' 'providers/v1/passworddepot/go.mod'
          printf '%s\n' 'providers/v1/previder/go.mod'
          printf '%s\n' 'providers/v1/pulumi/go.mod'
          printf '%s\n' 'providers/v1/scaleway/go.mod'
          printf '%s\n' 'providers/v1/secretserver/go.mod'
          printf '%s\n' 'providers/v1/senhasegura/go.mod'
          printf '%s\n' 'providers/v1/vault/go.mod'
          printf '%s\n' 'providers/v1/volcengine/go.mod'
          printf '%s\n' 'providers/v1/webhook/go.mod'
          printf '%s\n' 'providers/v1/yandex/go.mod'
          printf '%s\n' 'runtime/go.mod'
        } > "$modules"

        jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || printf '4')"
        if ! [[ "$jobs" =~ ^[1-9][0-9]*$ ]]; then
          jobs=4
        elif (( jobs > 8 )); then
          jobs=8
        fi

        # shellcheck disable=SC2016 # The quoted script is evaluated by the inner shell.
        xargs -P "$jobs" -I '{}' /bin/bash -c \
          'dir="${1%/go.mod}"; [[ "$dir" == "$1" ]] && dir=.; GOWORK=off go -C "$dir" mod tidy' _ '{}' < "$modules"
