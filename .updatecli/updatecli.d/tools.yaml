{{- $tools := dict
  "controller-gen" (dict "variable" "CONTROLLER_GEN" "repository" "kubernetes-sigs/controller-tools" "platforms" (dict "darwin-amd64" "controller-gen-darwin-amd64" "darwin-arm64" "controller-gen-darwin-arm64" "linux-amd64" "controller-gen-linux-amd64" "linux-arm64" "controller-gen-linux-arm64"))
  "crane" (dict "variable" "CRANE" "repository" "google/go-containerregistry" "platforms" (dict "darwin-amd64" "go-containerregistry_Darwin_x86_64.tar.gz" "darwin-arm64" "go-containerregistry_Darwin_arm64.tar.gz" "linux-amd64" "go-containerregistry_Linux_x86_64.tar.gz" "linux-arm64" "go-containerregistry_Linux_arm64.tar.gz"))
  "cty" (dict "variable" "CTY" "repository" "Skarlso/crd-to-sample-yaml" "platforms" (dict "darwin-amd64" "cty_darwin_amd64.tar.gz" "darwin-arm64" "cty_darwin_arm64.tar.gz" "linux-amd64" "cty_linux_amd64.tar.gz" "linux-arm64" "cty_linux_arm64.tar.gz"))
  "dlv" (dict "variable" "DLV" "repository" "go-delve/delve" "platforms" (dict "darwin-amd64" "dlv_{{version-no-v}}_darwin_amd64.tar.gz" "darwin-arm64" "dlv_{{version-no-v}}_darwin_arm64.tar.gz" "linux-amd64" "dlv_{{version-no-v}}_linux_amd64.tar.gz" "linux-arm64" "dlv_{{version-no-v}}_linux_arm64.tar.gz"))
  "golangci-lint" (dict "variable" "GOLANGCI_LINT" "repository" "golangci/golangci-lint" "platforms" (dict "darwin-amd64" "golangci-lint-{{version-no-v}}-darwin-amd64.tar.gz" "darwin-arm64" "golangci-lint-{{version-no-v}}-darwin-arm64.tar.gz" "linux-amd64" "golangci-lint-{{version-no-v}}-linux-amd64.tar.gz" "linux-arm64" "golangci-lint-{{version-no-v}}-linux-arm64.tar.gz"))
  "setup-envtest" (dict "variable" "SETUP_ENVTEST" "repository" "kubernetes-sigs/controller-runtime" "platforms" (dict "darwin-amd64" "setup-envtest-darwin-amd64" "darwin-arm64" "setup-envtest-darwin-arm64" "linux-amd64" "setup-envtest-linux-amd64" "linux-arm64" "setup-envtest-linux-arm64"))
  "tilt" (dict "variable" "TILT" "repository" "tilt-dev/tilt" "platforms" (dict "darwin-amd64" "tilt.{{version-no-v}}.mac.x86_64.tar.gz" "darwin-arm64" "tilt.{{version-no-v}}.mac.arm64.tar.gz" "linux-amd64" "tilt.{{version-no-v}}.linux.x86_64.tar.gz" "linux-arm64" "tilt.{{version-no-v}}.linux.arm64.tar.gz"))
  "updatecli" (dict "variable" "UPDATECLI" "repository" "updatecli/updatecli" "platforms" (dict "darwin-amd64" "updatecli_Darwin_x86_64.tar.gz" "darwin-arm64" "updatecli_Darwin_arm64.tar.gz" "linux-amd64" "updatecli_Linux_x86_64.tar.gz" "linux-arm64" "updatecli_Linux_arm64.tar.gz"))
-}}
name: Update development tools

# Upstream metadata and update policy live here. The current versions and
# platform checksums are maintained directly in the Makefile.
sources:
{{- range $name, $tool := $tools }}
  "{{ $name }}_version":
    name: Get latest {{ $name }} release
    kind: githubrelease
    spec:
      owner: {{ first (splitList "/" $tool.repository) }}
      repository: {{ last (splitList "/" $tool.repository) }}
      age:
        minimum: 168h
      versionfilter:
        kind: semver
{{- if eq $name "dlv" }}
        pattern: '<1.27.0'
{{- else if eq $name "cty" }}
        pattern: '1.1.x'
{{- else }}
        pattern: '*'
{{- end }}
{{- if eq $name "golangci-lint" }}
  "{{ $name }}_version_no_v":
    kind: githubrelease
    transformers:
      - trimprefix: v
    spec:
      owner: golangci
      repository: golangci-lint
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
{{- end }}
{{- range $platformName, $asset := $tool.platforms }}
{{- $assetPattern := regexQuoteMeta $asset }}
{{- $assetPattern = replace "\\{\\{version-no-v\\}\\}" "[0-9]+(?:\\.[0-9]+)+" $assetPattern }}
  "{{ $name }}_{{ replace "-" "_" $platformName }}_sha256":
    name: Get {{ $name }} checksum for {{ $platformName }}
    kind: http
    transformers:
      - findsubmatch:
{{- if or (eq $name "controller-gen") (eq $name "setup-envtest") }}
          pattern: '(?s)"name"\s*:\s*"{{ $assetPattern }}".*?"digest"\s*:\s*"sha256:([a-f0-9]{64})"'
{{- else }}
          pattern: '(?m)^([a-f0-9]{64})\s+\*?{{ $assetPattern }}$'
{{- end }}
          captureindex: 1
    spec:
{{- if or (eq $name "controller-gen") (eq $name "setup-envtest") }}
      url: https://api.github.com/repos/{{ $tool.repository }}/releases/tags/{{ "{{" }} source "{{ $name }}_version" {{ "}}" }}
      request:
        headers:
          Authorization: 'Bearer {{ requiredEnv "GITHUB_TOKEN" }}'
{{- else if eq $name "golangci-lint" }}
      url: https://github.com/{{ $tool.repository }}/releases/download/{{ "{{" }} source "{{ $name }}_version" {{ "}}" }}/golangci-lint-{{ "{{" }} source "{{ $name }}_version_no_v" {{ "}}" }}-checksums.txt
{{- else if eq $name "cty" }}
      url: https://github.com/{{ $tool.repository }}/releases/download/{{ "{{" }} source "{{ $name }}_version" {{ "}}" }}/cty_checksums.txt
{{- else }}
      url: https://github.com/{{ $tool.repository }}/releases/download/{{ "{{" }} source "{{ $name }}_version" {{ "}}" }}/checksums.txt
{{- end }}
{{- end }}
{{- end }}

  envtest_kubernetes_version:
    kind: githubrelease
    transformers:
      - findsubmatch:
          pattern: '^v([0-9]+\.[0-9]+)\.[0-9]+$'
          capturepattern: '\1.x'
    spec:
      owner: kubernetes
      repository: kubernetes
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  helm_schema_plugin_version:
    kind: githubrelease
    transformers:
      - trimprefix: v
    spec:
      owner: losisin
      repository: helm-values-schema-json
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  helm_unittest_plugin_version:
    kind: githubrelease
    transformers:
      - trimprefix: v
    spec:
      owner: helm-unittest
      repository: helm-unittest
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  kind_version:
    kind: githubrelease
    spec:
      owner: kubernetes-sigs
      repository: kind
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  kubectl_version:
    kind: githubrelease
    spec:
      owner: kubernetes
      repository: kubernetes
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  helm_version:
    kind: githubrelease
    spec:
      owner: helm
      repository: helm
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  ginkgo_version:
    kind: golang/module
    spec:
      module: github.com/onsi/ginkgo/v2
      versionfilter:
        kind: semver
        pattern: '*'
  cosign_version:
    kind: githubrelease
    spec:
      owner: sigstore
      repository: cosign
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  syft_version:
    kind: githubrelease
    spec:
      owner: anchore
      repository: syft
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'
  flux_version:
    kind: githubrelease
    spec:
      owner: fluxcd
      repository: flux2
      age:
        minimum: 168h
      versionfilter:
        kind: semver
        pattern: '*'

targets:
{{- range $name, $tool := $tools }}
  "{{ $name }}_version":
    name: Update {{ $name }} version
    kind: file
    sourceid: "{{ $name }}_version"
    spec:
      file: Makefile
      matchpattern: '(?m)^{{ $tool.variable }}_VERSION := v?[0-9]+\.[0-9]+\.[0-9]+$'
      replacepattern: '{{ $tool.variable }}_VERSION := {{ "{{" }} source "{{ $name }}_version" {{ "}}" }}'
{{- range $platformName, $_ := $tool.platforms }}
{{- $platformVariable := upper (replace "-" "_" $platformName) }}
  "{{ $name }}_{{ replace "-" "_" $platformName }}_sha256":
    name: Update {{ $name }} checksum for {{ $platformName }}
    kind: file
    sourceid: "{{ $name }}_{{ replace "-" "_" $platformName }}_sha256"
    spec:
      file: Makefile
      matchpattern: '(?m)^{{ $tool.variable }}_{{ $platformVariable }}_SHA256 := [a-f0-9]{64}$'
      replacepattern: '{{ $tool.variable }}_{{ $platformVariable }}_SHA256 := {{ "{{" }} source "{{ $name }}_{{ replace "-" "_" $platformName }}_sha256" {{ "}}" }}'
{{- end }}
{{- end }}

  envtest_kubernetes_version:
    kind: file
    sourceid: envtest_kubernetes_version
    spec:
      file: Makefile
      matchpattern: '(?m)^ENVTEST_KUBERNETES_VERSION := [0-9]+\.[0-9]+\.x$'
      replacepattern: 'ENVTEST_KUBERNETES_VERSION := {{ source "envtest_kubernetes_version" }}'
  kubernetes_ci_version:
    kind: file
    sourceid: envtest_kubernetes_version
    spec:
      file: .github/workflows/ci.yml
      matchpattern: "KUBERNETES_VERSION: '[0-9]+\\.[0-9]+\\.x'"
      replacepattern: 'KUBERNETES_VERSION: ''{{ source `envtest_kubernetes_version` }}'''
  helm_schema_plugin_version:
    kind: file
    sourceid: helm_schema_plugin_version
    spec:
      file: Makefile
      matchpattern: '(?m)^HELM_SCHEMA_PLUGIN_VERSION := [0-9]+\.[0-9]+\.[0-9]+$'
      replacepattern: 'HELM_SCHEMA_PLUGIN_VERSION := {{ source "helm_schema_plugin_version" }}'
  helm_unittest_plugin_version:
    kind: file
    sourceid: helm_unittest_plugin_version
    spec:
      file: Makefile
      matchpattern: '(?m)^HELM_UNITTEST_PLUGIN_VERSION := [0-9]+\.[0-9]+\.[0-9]+$'
      replacepattern: 'HELM_UNITTEST_PLUGIN_VERSION := {{ source "helm_unittest_plugin_version" }}'
  kind_version:
    kind: file
    sourceid: kind_version
    spec:
      files:
        - .github/workflows/e2e.yml
        - .github/workflows/e2e-reusable.yml
      matchpattern: "KIND_VERSION: 'v?[0-9]+\\.[0-9]+\\.[0-9]+'"
      replacepattern: 'KIND_VERSION: ''{{ source `kind_version` }}'''
  kubectl_version:
    kind: file
    sourceid: kubectl_version
    spec:
      file: e2e/Dockerfile
      matchpattern: 'ENV KUBECTL_VERSION="v?[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'ENV KUBECTL_VERSION="{{ source `kubectl_version` }}"'
  helm_version:
    kind: file
    sourceid: helm_version
    spec:
      file: e2e/Dockerfile
      matchpattern: 'ENV HELM_VERSION="v?[0-9]+\.[0-9]+\.[0-9]+"'
      replacepattern: 'ENV HELM_VERSION="{{ source `helm_version` }}"'
  helm_workflow_version:
    kind: file
    sourceid: helm_version
    spec:
      file: .github/workflows/helm.yml
      matchpattern: 'version: v[0-9]+\.[0-9]+\.[0-9]+'
      replacepattern: 'version: {{ source `helm_version` }}'
  ginkgo_version:
    kind: file
    sourceid: ginkgo_version
    spec:
      file: e2e/Dockerfile
      matchpattern: 'github.com/onsi/ginkgo/v2/ginkgo@v[0-9]+\.[0-9]+\.[0-9]+'
      replacepattern: 'github.com/onsi/ginkgo/v2/ginkgo@{{ source `ginkgo_version` }}'
  cosign_version:
    kind: file
    sourceid: cosign_version
    spec:
      files:
        - .github/actions/sign/action.yml
        - .github/workflows/helm.yml
      matchpattern: 'cosign-release: [''\"]v?[0-9]+\.[0-9]+\.[0-9]+[''\"]'
      replacepattern: 'cosign-release: ''{{ source `cosign_version` }}'''
  syft_version:
    kind: file
    sourceid: syft_version
    spec:
      file: .github/actions/sign/action.yml
      matchpattern: 'syft-version: v?[0-9]+\.[0-9]+\.[0-9]+'
      replacepattern: 'syft-version: {{ source `syft_version` }}'
  flux_version:
    kind: file
    sourceid: flux_version
    spec:
      file: e2e/suites/flux/install.go
      matchpattern: 'flux2/releases/download/v?[0-9]+\.[0-9]+\.[0-9]+/install.yaml'
      replacepattern: 'flux2/releases/download/{{ source `flux_version` }}/install.yaml'
