apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    external-secrets.io/component: controller
  name: serviceaccounttokens.generators.external-secrets.io
spec:
  group: generators.external-secrets.io
  names:
    categories:
    - external-secrets
    - external-secrets-generators
    kind: ServiceAccountToken
    listKind: ServiceAccountTokenList
    plural: serviceaccounttokens
    singular: serviceaccounttoken
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ServiceAccountToken issues short-lived Kubernetes ServiceAccount
          tokens through the TokenRequest API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceAccountTokenSpec controls how a Kubernetes ServiceAccount
              token is issued.
            properties:
              expirationSeconds:
                description: |-
                  ExpirationSeconds is the requested lifetime of the token, in seconds.

                  The issuer may return a shorter validity than requested: the API server
                  enforces its own bounds and `--service-account-max-token-expiration` caps
                  requests without reporting it. The generated `expirationTimestamp` is
                  therefore authoritative, not this field. See [TokenRequest].

                  Defaults to the API server's own default when unset.

                  [TokenRequest]: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
                format: int64
                type: integer
              serviceAccountRef:
                description: |-
                  ServiceAccountRef names the ServiceAccount to issue a token for and carries
                  the audiences to request.

                  The token is always issued in the namespace this generator is evaluated in.
                  Setting `namespace` is rejected rather than ignored, because issuing a token
                  in another namespace would let the caller reach beyond it.
                properties:
                  audiences:
                    description: |-
                      Audience specifies the `aud` claim for the service account token
                      If the service account uses a well-known annotation for e.g. IRSA or GCP Workload Identity
                      then this audiences will be appended to the list
                    items:
                      type: string
                    type: array
                  name:
                    description: The name of the ServiceAccount resource being referred
                      to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of the resource being referred to.
                      Ignored if referent is not cluster-scoped, otherwise defaults to the namespace of the referent.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
            required:
            - serviceAccountRef
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
