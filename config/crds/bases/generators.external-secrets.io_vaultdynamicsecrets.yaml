---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  labels:
    external-secrets.io/component: controller
  name: vaultdynamicsecrets.generators.external-secrets.io
spec:
  group: generators.external-secrets.io
  names:
    categories:
    - external-secrets
    - external-secrets-generators
    kind: VaultDynamicSecret
    listKind: VaultDynamicSecretList
    plural: vaultdynamicsecrets
    singular: vaultdynamicsecret
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VaultDynamicSecret represents a generator that can create dynamic
          secrets from HashiCorp Vault.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VaultDynamicSecretSpec defines the desired spec of VaultDynamicSecret.
            properties:
              allowEmptyResponse:
                default: false
                description: Do not fail if no secrets are found. Useful for requests
                  where no data is expected.
                type: boolean
              controller:
                description: |-
                  Used to select the correct ESO controller (think: ingress.ingressClassName)
                  The ESO controller is instantiated with a specific controller name and filters VDS based on this property
                type: string
              getParameters:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  GetParameters are query-string parameters passed to Vault on GET calls.
                  Each key may map to multiple values, matching HTTP query-string semantics.
                  Ignored for non-GET methods; use Parameters for write bodies.
                type: object
              method:
                description: Vault API method to use (GET/POST/other)
                type: string
              parameters:
                description: Parameters to pass to Vault write (for non-GET methods)
                x-kubernetes-preserve-unknown-fields: true
              path:
                description: Vault path to obtain the dynamic secret from
                type: string
              provider:
                $ref: '#/definitions/github.com~1external-secrets~1external-secrets~1apis~1externalsecrets~1v1~0VaultProvider'
                description: Vault provider common spec
              resultType:
                default: Data
                description: |-
                  Result type defines which data is returned from the generator.
                  By default, it is the "data" section of the Vault API response.
                  When using e.g. /auth/token/create the "data" section is empty but
                  the "auth" section contains the generated token.
                  Please refer to the vault docs regarding the result data structure.
                  Additionally, accessing the raw response is possibly by using "Raw" result type.
                enum:
                - Data
                - Auth
                - Raw
                type: string
              retrySettings:
                $ref: '#/definitions/github.com~1external-secrets~1external-secrets~1apis~1externalsecrets~1v1~0SecretStoreRetrySettings'
                description: Used to configure http retries if failed
            required:
            - path
            - provider
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
