suite: test webhook serviceaccount and secret
templates:
  - webhook-serviceaccount.yaml

tests:
  - it: should create ServiceAccount when webhook.create and webhook.serviceAccount.create are true
    set: 
      webhook.create: true
      webhook.serviceAccount.create: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
  - it: should create Secret and ServiceAccount when webhook.metrics.listen.auth.enabled webhook.create and webhook.serviceAccount.create set to true
    set:
      webhook.metrics.listen.auth.enabled: true
      webhook.create: true
      webhook.serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 2
  - it: should not create Secret when webhook.metrics.listen.auth.enabled is false 
    set:
      webhook.metrics.listen.auth.enabled: false
      webhook.create: true
      webhook.serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 1
  - it: should not create Secret and ServiceAccount when webhook.create is false 
    set:
      webhook.metrics.listen.auth.enabled: true
      webhook.create: false
      webhook.serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create Secret and ServiceAccount when webhook.serviceAccount.create is false 
    set:
      webhook.metrics.listen.auth.enabled: true
      webhook.create: true
      webhook.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create Secret and ServiceAccount when webhook.metrics.listen.auth.enabled webhook.serviceAccount.create webhook.create are false 
    set:
      webhook.metrics.listen.auth.enabled: false
      webhook.create: false
      webhook.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should derive the ServiceAccount name from the chart fullname
    set:
      webhook.create: true
      webhook.serviceAccount.create: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: RELEASE-NAME-external-secrets-webhook
  - it: should honor fullnameOverride in the ServiceAccount name
    set:
      fullnameOverride: my-prefix
      webhook.create: true
      webhook.serviceAccount.create: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: my-prefix-webhook
  - it: should honor nameOverride in the ServiceAccount name
    set:
      nameOverride: eso
      webhook.create: true
      webhook.serviceAccount.create: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: RELEASE-NAME-eso-webhook
  - it: should prefer an explicit webhook.serviceAccount.name
    set:
      fullnameOverride: my-prefix
      webhook.create: true
      webhook.serviceAccount.create: true
      webhook.serviceAccount.name: custom-webhook
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: custom-webhook
  - it: should keep the ServiceAccount name within the 63 character limit
    set:
      fullnameOverride: external-secrets-production-cluster-for-long-release-testing
      webhook.create: true
      webhook.serviceAccount.create: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: external-secrets-production-cluster-for-long-release-te-webhook