suite: test crds
templates:
  - crds/secretstore.yaml
tests:
  - it: should match snapshot of default values
    asserts:
      - matchSnapshot: {}
  - it: should keep the CRDs by default
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: should not add the keep annotation when crds.keep is false
    set:
      crds.keep: false
    asserts:
      - isNull:
          path: metadata.annotations["helm.sh/resource-policy"]

  - it: should disable conversion webhook
    set:
      crds.conversion.enabled: false
    asserts:
      - isNull:
          path: spec.conversion

  - it: should add annotations
    set:
      crds:
        annotations:
          foo: bar
          baz: bang
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar
      - equal:
          path: metadata.annotations.baz
          value: bang
