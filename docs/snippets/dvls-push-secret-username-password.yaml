apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-db-credentials-to-dvls
spec:
  refreshInterval: 1h
  # Write each field once and keep it: a field the vault already holds is not overwritten.
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: dvls-store
      kind: SecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: db-password
  template:
    data:
      username: app
      password: '{{ .password }}'
  data:
    # Both items address the same entry. Naming a property creates it as a
    # Credential/Default (username and password) entry.
    - match:
        secretKey: username
        remoteRef:
          remoteKey: 'prod/db/credentials'
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: 'prod/db/credentials'
          property: password
