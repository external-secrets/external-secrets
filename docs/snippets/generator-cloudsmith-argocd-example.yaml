{% raw %}
apiVersion: generators.external-secrets.io/v1alpha1
kind: CloudsmithAccessToken
metadata:
  name: my-cloudsmith-token
  namespace: argocd
spec:
  orgSlug: "my-organization"
  serviceSlug: "my-oidc-service"
  serviceAccountRef:
    name: "default"
    audiences:
      - "https://api.cloudsmith.io"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudsmith-helm-oci-repo
  namespace: argocd
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: CloudsmithAccessToken
          name: my-cloudsmith-token
  refreshInterval: 50m0s # Refresh before token expires
  target:
    name: cloudsmith-helm-oci-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        project: myproject
        type: oci
        url: oci://helm.oci.cloudsmith.io

{% endraw %}
