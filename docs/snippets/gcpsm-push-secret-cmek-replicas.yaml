apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pushsecret-example
spec:
  # ... other fields ...
  data:
    - match:
        secretKey: mykey
        remoteRef:
          remoteKey: my-secret
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          replicationLocations:
            - location: us-east4
              cmekKeyName: "projects/my-project/locations/us-east4/keyRings/my-keyring/cryptoKeys/my-key"
            - location: us-west3
              cmekKeyName: "projects/my-project/locations/us-west3/keyRings/my-keyring/cryptoKeys/my-key"
