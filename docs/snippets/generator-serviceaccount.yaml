apiVersion: generators.external-secrets.io/v1alpha1
kind: ServiceAccountToken
metadata:
  name: argocd-remote-token
spec:

  # the ServiceAccount to issue a token for.
  # it must live in the same namespace as this generator: naming another
  # namespace is rejected, not ignored.
  serviceAccountRef:
    name: argocd-remote

    # optional: the `aud` claim to request.
    # defaults to the API server's own audience when omitted.
    audiences:
      - https://kubernetes.default.svc

  # optional: requested lifetime, in seconds.
  # the API server may return a shorter one — see the note on refreshInterval
  # in the generator documentation.
  expirationSeconds: 3600
