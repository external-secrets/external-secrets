apiVersion: generators.external-secrets.io/v1alpha1
kind: ServiceAccountToken
metadata:
  name: argocd-remote-token
spec:

  # the ServiceAccount to issue a token for.
  # it must live in the same namespace as this generator: naming another
  # namespace is rejected, not ignored.
  serviceAccountRef:
    name: argocd-remote

    # optional: the `aud` claim to request.
    #
    # the value has to be one the consumer accepts. for the API server itself that
    # is whatever it was started with (--api-audiences, defaulting to
    # --service-account-issuer), which is not the same string on every cluster —
    # check yours before copying this line, or omit the field and take the default.
    audiences:
      - https://kubernetes.default.svc

  # optional: requested lifetime, in seconds.
  # the API server may return a shorter one — see the note on refreshInterval
  # in the generator documentation.
  expirationSeconds: 3600
