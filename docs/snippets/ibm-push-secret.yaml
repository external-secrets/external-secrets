apiVersion: v1
kind: Secret
metadata:
  name: source-secret
stringData:
  token: "my-secret"
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pushsecret-example
spec:
  deletionPolicy: Delete
  refreshInterval: 1h0m0s
  secretStoreRefs:
    - name: ibm-store
      kind: SecretStore
  selector:
    secret:
      name: source-secret
  data:
    # push one key to an arbitrary secret
    - match:
        secretKey: token
        remoteRef:
          remoteKey: <SECRET_GROUP_NAME>/arbitrary/<SECRET_NAME>
    # push one key to a property of a kv secret
    - match:
        secretKey: token
        remoteRef:
          remoteKey: <SECRET_GROUP_NAME>/kv/<SECRET_NAME>
          property: token
