apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
 name: beyondtrust-external-secret-mixed
spec:
 refreshInterval: 1h0m0s
 secretStoreRef:
   kind: SecretStore
   name: secretstore-beyondtrust # store with retrievalType: ALL
 target:
   name: my-beyondtrust-mixed-secret
   creationPolicy: Owner
 data:
   - secretKey: db-password
     remoteRef:
       key: managed:system01/managed_account01 # Password Safe managed account
   - secretKey: api-key
     remoteRef:
       key: secret:app/folder/api-key # Secrets Safe secret
