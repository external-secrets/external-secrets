apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: beyondtrustworkloadcredentials-oidc-ss
  namespace: external-secrets
spec:
  provider:
    beyondtrustworkloadcredentials:
      auth:
        oidc:
          # Service name from the OIDC issuer registration in BeyondTrust Pathfinder Platform
          serviceName: <SERVICE_NAME>
          serviceAccountRef:
            # ServiceAccount whose token is presented to BeyondTrust Workload Credentials
            name: eso-wlc
            # Optional: defaults to the siteId
            # audiences:
            #   - <SITE_ID>
      server:
        apiUrl: "https://api.beyondtrust.io/site"
        siteId: <SITE_ID>
      folderPath: <FOLDER_PATH>
