apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur-gcp-secretref
  namespace: default
spec:
  provider:
    conjur:
      url: https://conjur.example.com
      # caBundle: <base64-encoded PEM>  # uncomment for self-signed certs
      auth:
        gcp:
          account: myorg
          serviceID: prod
          hostId: data/myapp/myhost
          secretRef:
            jwt:
              name: gcp-token-secret  # Kubernetes Secret in the same namespace
              key: token              # key within the Secret holding the GCP identity token
