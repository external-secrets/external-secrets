apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pushsecret-sap-credential-store
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: sap-credential-store
      kind: SecretStore
  selector:
    secret:
      name: my-k8s-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: my-pushed-password
          property: password
