apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-managed-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: infisical

  target:
    name: auth-api

  dataFrom:
    - find:
        # Filter by secret name using a regular expression.
        name:
          regexp: "^DB_.*"
        # Optionally also search from a folder (must be an absolute path
        # starting with `/`). Whether sub-folders are read follows the store's
        # recursive setting, and the name above still applies. Omit to search
        # from the store's secretsScope.secretsPath instead.
        # path: /my-app
        # Optionally also filter by Infisical tags and metadata. All entries
        # must match. `infisical.com/tags` lists tag slugs, comma-separated.
        # Every other key matches a metadata key and value.
        # tags:
        #   infisical.com/tags: "hipaa,prod"
        #   team: payments
