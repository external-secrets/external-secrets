apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: akeyless-jwt-auth
  namespace: app-test
spec:
  provider:
    akeyless:
      akeylessGWApiURL: "https://api.akeyless.io"
      authSecretRef:
        jwtAuth:
          accessID: "p-xxxxxx"
          # Option A: JWT stored in a Secret (IdP-issued access/ID token)
          secretRef:
            name: akeyless-jwt
            key: token
          # Option B: mint a Kubernetes SA token via TokenRequest
          # (requires create on serviceaccounts/token — Helm rbac.serviceAccountTokenCreate, default true)
          # serviceAccountRef:
          #   name: akeyless-jwt-sa
          #   audiences:
          #     - "https://vault.akeyless.io"
          # expirationSeconds: 600
