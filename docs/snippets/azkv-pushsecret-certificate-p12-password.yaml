apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-encrypted-certificate
  namespace: default
spec:
  refreshInterval: 1h
  deletionPolicy: Delete
  secretStoreRefs:
    - name: azure-store
      kind: SecretStore
  selector:
    secret:
      name: source-certificate
  data:
    - match:
        secretKey: cert.p12
        remoteRef:
          remoteKey: cert/my-azkv-cert-name
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          passwordSecretRef:
            name: certificate-password
            key: password
