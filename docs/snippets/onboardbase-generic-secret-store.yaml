apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onboardbase-external-secret-store
spec:
  provider:
    onboardbase:
      project: project-name # can be altered from here
      environment: development # can be altered from here
      auth:
        apiKeyRef:
          name: onboardbase-auth-secret
          key: API_KEY
        passcodeRef:
          name: onboardbase-auth-secret
          key: PASSCODE
