apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur-azure-ambient
  namespace: default
spec:
  provider:
    conjur:
      url: https://conjur.example.com
      # caBundle: <base64-encoded PEM>  # uncomment for self-signed certs
      auth:
        azure:
          account: myorg
          serviceID: prod          # authn-azure webservice ID in Conjur policy
          hostId: data/myapp/myhost  # Conjur host mapped to the Azure managed identity
          # clientId: <managed-identity-client-id>  # required for user-assigned managed identities
