apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: conjur
spec:
  refreshInterval: 1h0m0s
  # Only the Replace update policy is supported by the Secrets Manager provider.
  updatePolicy: Replace
  # Deleting pushed variables is not supported, keep the default deletion policy.
  deletionPolicy: None
  secretStoreRefs:
    # This name must match the metadata.name in the `SecretStore`
    - name: conjur
      kind: SecretStore
  selector:
    secret:
      # Source Kubernetes secret to be pushed
      name: app1-credentials
  data:
    - match:
        # Key in the source Kubernetes secret
        secretKey: password
        remoteRef:
          # <parent policy>/<policy to create>; must contain at least one '/'
          remoteKey: data/app1/pushed
          # Creates the variable data/app1/pushed/db-password
          property: db-password
