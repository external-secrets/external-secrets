apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proton-pass-example
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: proton-pass-store
    kind: SecretStore
  target:
    name: my-secret
  data:
    # Address the item by title; default property is "password".
    - secretKey: db-password
      remoteRef:
        key: Database
        # property: password # optional; defaults to "password"
    # Address by Item ID and pick a specific field.
    - secretKey: api-key
      remoteRef:
        key: id:abc123def456
        property: API Key
  # Pull every field of an item into the Secret.
  dataFrom:
    - extract:
        key: Database
