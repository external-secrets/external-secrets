apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secretstash-external-secret
spec:
  secretStoreRef:
    kind: SecretStore
    name: secretstash-secretstore
  target:
    name: imported-secret-map
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secretstashSecretID
