apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur-iam
  namespace: default
spec:
  provider:
    conjur:
      url: https://conjur.example.com
      # caBundle: <base64-encoded PEM>  # uncomment for self-signed certs
      auth:
        iam:
          account: myorg
          serviceID: prod          # authn-iam webservice ID in Conjur policy
          hostId: data/myapp/123456789012/MyRole  # Conjur host mapped to the AWS IAM role
          # secretRef:             # omit to use ambient credentials (IRSA, instance profile, etc.)
          #   accessKeyIDSecretRef:
          #     name: aws-creds
          #     key: access-key-id
          #   secretAccessKeySecretRef:
          #     name: aws-creds
          #     key: secret-access-key
          #   sessionTokenSecretRef:  # required only when using temporary credentials
          #     name: aws-creds
          #     key: session-token
