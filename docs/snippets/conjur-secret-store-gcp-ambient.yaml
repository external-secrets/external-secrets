apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur-gcp-ambient
  namespace: default
spec:
  provider:
    conjur:
      url: https://conjur.example.com
      # caBundle: <base64-encoded PEM>  # uncomment for self-signed certs
      auth:
        gcp:
          account: myorg
          serviceID: prod          # reserved for future use; not used by authn-gcp today
          hostId: data/myapp/myhost  # Conjur host mapped to the GCP service account
