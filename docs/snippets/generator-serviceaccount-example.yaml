apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "argocd-remote-token"
spec:
  # keep this comfortably below the token's lifetime: regeneration is driven by
  # refreshInterval alone, so a value at or above the expiry leaves a dead token
  # in the Secret until the next tick.
  refreshInterval: "30m"
  target:
    name: argocd-remote-token
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ServiceAccountToken
        name: "argocd-remote-token"
