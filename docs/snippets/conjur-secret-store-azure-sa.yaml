apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur-azure-sa
  namespace: default
spec:
  provider:
    conjur:
      url: https://conjur.example.com
      # caBundle: <base64-encoded PEM>  # uncomment for self-signed certs
      auth:
        azure:
          account: myorg
          serviceID: prod
          hostId: data/myapp/myhost
          serviceAccountRef:
            name: my-service-account  # Kubernetes ServiceAccount in the same namespace
            audiences:
              - conjur              # must match the Conjur authn-azure policy audience
