apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: example
spec:
  secretStoreRefs:
    - name: keeper
      kind: SecretStore
  refreshInterval: "1h0m0s"
  deletionPolicy: Delete
  selector:
    secret:
      name: secret-name # k8s secret to be pushed
  data:
    # Push all source Secret keys to one Keeper record.
    - match:
        remoteRef:
          remoteKey: remote-whole-secret
    # Push selected source keys to separate properties on one Keeper record.
    - match:
        secretKey: secret-key # k8s key within the secret to be pushed
        remoteRef:
          remoteKey: remote-property-secret
          property: api-token
    - match:
        secretKey: another-secret-key
        remoteRef:
          remoteKey: remote-property-secret
          property: client-id
    # Legacy record/key form remains supported.
    - match:
        secretKey: legacy-secret-key
        remoteRef:
          remoteKey: remote-legacy-secret/legacy-secret-key


