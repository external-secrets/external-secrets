apiVersion: v1
kind: ServiceAccount
metadata:
  name: akeyless-irsa-sa
  namespace: app-test
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/akeyless-app-test
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: akeyless-aws-iam-irsa
  namespace: app-test
spec:
  provider:
    akeyless:
      akeylessGWApiURL: "https://api.akeyless.io"
      authSecretRef:
        secretRef:
          accessID:
            name: akeyless-secret-creds
            key: accessId
          accessType: # aws_iam
            name: akeyless-secret-creds
            key: accessType
        serviceAccountRef:
          name: akeyless-irsa-sa
